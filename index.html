
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8edf5;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #202938;
            border-radius: 20px;
            box-shadow: 0 10px 25px #0003;
        }

        h2 {
            text-align: center;
            color: white;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #f5f7fa;
            color: #111827;
            font-size: 28px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #37465c;
            color: white;
        }

        button:hover {
            background: #52647c;
        }

        .operator {
            background: #f59e0b;
            color: #111827;
        }

        .clear {
            background: #ef4444;
        }

        .equal {
            background: #22c55e;
            color: #111827;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Calculator</h2>

        <input type="text" id="display"
               value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let startNewNumber = true;

        function addNumber(number) {
            if (startNewNumber) {
                display.value = number === "." ? "0." : number;
                startNewNumber = false;
                return;
            }

            if (number === "." && display.value.includes(".")) {
                return;
            }

            if (display.value === "0" && number !== ".") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        function chooseOperator(op) {
            if (display.value === "Error") return;

            if (operator !== null && !startNewNumber) {
                calculate();
            }

            firstNumber = Number(display.value);
            operator = op;
            startNewNumber = true;
        }

        function calculate() {
            if (operator === null || firstNumber === null) return;

            const secondNumber = Number(display.value);
            let result;

            switch (operator) {
                case "+":
                    result = firstNumber + secondNumber;
                    break;
                case "-":
                    result = firstNumber - secondNumber;
                    break;
                case "*":
                    result = firstNumber * secondNumber;
                    break;
                case "/":
                    result = secondNumber === 0
                        ? "Error"
                        : firstNumber / secondNumber;
                    break;
                case "%":
                    result = firstNumber % secondNumber;
                    break;
            }

            display.value = typeof result === "number"
                ? String(Number(result.toPrecision(10)))
                : result;

            firstNumber = null;
            operator = null;
            startNewNumber = true;
        }

        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            startNewNumber = true;
        }

        function deleteLast() {
            if (display.value === "Error") {
                clearDisplay();
                return;
            }

            if (startNewNumber) return;

            display.value = display.value.length > 1
                ? display.value.slice(0, -1)
                : "0";
        }
    </script>

</body>
</html>
